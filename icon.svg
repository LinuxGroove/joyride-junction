<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ee0"/>
      <stop offset="1" stop-color="#a9dcf5"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#sky)"/>
  <!-- the hills -->
  <path d="M0 196 Q64 168 128 186 T256 178 V208 Q256 256 208 256 H48 Q0 256 0 208 Z" fill="#5f9e45"/>
  <!-- wooden supports under the lift hill and the drop -->
  <g stroke="#9a6a40" stroke-width="6" stroke-linecap="round">
    <line x1="58" y1="150" x2="58" y2="192"/>
    <line x1="84" y1="102" x2="84" y2="188"/>
    <line x1="110" y1="66" x2="110" y2="184"/>
    <line x1="136" y1="64" x2="136" y2="186"/>
    <line x1="162" y1="104" x2="162" y2="188"/>
    <line x1="188" y1="148" x2="188" y2="186"/>
    <line x1="84" y1="140" x2="136" y2="100" stroke-width="4"/>
    <line x1="110" y1="110" x2="162" y2="150" stroke-width="4"/>
  </g>
  <!-- the track: up the lift hill and down the drop -->
  <path d="M22 178 C60 170 96 60 124 56 C152 52 176 150 236 170" fill="none" stroke="#8a5a35" stroke-width="14" stroke-linecap="round"/>
  <path d="M22 172 C60 164 96 54 124 50 C152 46 176 144 236 164" fill="none" stroke="#e8eef4" stroke-width="5" stroke-linecap="round"/>
  <!-- the train cresting the top -->
  <g transform="translate(124 55)">
    <rect x="-27" y="-24" width="25" height="20" rx="6" fill="#e8553f"/>
    <rect x="2" y="-24" width="25" height="20" rx="6" fill="#e8553f"/>
    <circle cx="-15" cy="-27" r="7" fill="#ffd23f"/>
    <circle cx="14" cy="-27" r="7" fill="#6b3f2a"/>
    <rect x="-27" y="-9" width="54" height="5" fill="#ffd23f"/>
  </g>
</svg>
