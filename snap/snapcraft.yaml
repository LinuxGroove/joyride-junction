name: joyride-junction
title: Joyride Junction
adopt-info: joyride-junction
base: core24
summary: Build a theme park, ride your own coasters and keep the crowds happy.
description: |
  Joyride Junction is a theme park building game. Lay the paths, build
  wooden roller coasters piece by piece, put up food, drink and toilet
  stalls, and watch your guests ride, eat, queue, grumble and cheer.

  - Build coasters piece by piece, or place a ready-made one. Every ride
    gets a test run with real speeds and forces, and ratings for
    excitement, intensity and nausea
  - Guests have needs and opinions: look at any of them to see what they
    think
  - A scenario with a goal and a deadline, or a sandbox with no limits
  - Keep as many parks as you like and switch between them any time
  - Made for controllers and handhelds, fully playable with a mouse and
    keyboard
icon: icon.png
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0
website: https://github.com/LinuxGroove/joyride-junction
source-code: https://github.com/LinuxGroove/joyride-junction
issues: https://github.com/LinuxGroove/joyride-junction/issues

platforms:
  amd64:
  arm64:

apps:
  joyride-junction:
    command: bin/joyride-junction
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network
      - network-bind

parts:
  joyride-junction:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/joyride-junction"
      test -f "$CRAFT_PART_INSTALL/game/joyride-junction.pck"
      install -m 755 snap/local/joyride-junction "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
